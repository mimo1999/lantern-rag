[project]
name = "permission-aware-rag"
version = "0.1.0"
description = "Permission-aware, multi-tenant RAG: answers only from documents you may read. FastAPI, pgvector, Ollama, Docling."
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=23.1,<26.0",
    "asyncpg>=0.30,<1.0",
    "docling>=2.137.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "prometheus-client>=0.21,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "pyjwt>=2.10,<3.0",
    "python-multipart>=0.0.20",
    "uvicorn>=0.32,<1.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
# Tests marked slow load the Docling models; run them with `pytest -m slow`.
markers = ["slow: loads the Docling models (tens of seconds)"]
addopts = "-m 'not slow'"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.db" = ["migrations/*.sql"]
app = ["web/*", "web/app/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
